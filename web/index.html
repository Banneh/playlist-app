<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DJ HQ</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎧</text></svg>">
<link rel="stylesheet" href="app.css">
<link rel="stylesheet" href="pages/extras.css">
<link rel="stylesheet" href="pages/inbox.css">
<link rel="stylesheet" href="pages/prepare.css">
<link rel="stylesheet" href="pages/welcome.css">
<link rel="stylesheet" href="pages/setup.css">
<link rel="stylesheet" href="guide.css">
<link rel="stylesheet" href="pages/settings.css">
<link rel="stylesheet" href="pages/workthrough.css">
<link rel="stylesheet" href="pages/discover.css">
<link rel="stylesheet" href="pages/likes.css">
<link rel="stylesheet" href="player.css">
</head>
<body>

<!-- first run: no library yet (filled by pages/welcome.js) -->
<div id="welcome" class="welcome" hidden></div>

<div id="app" class="app" hidden>
  <aside class="sidebar">
    <div class="sb-brand">
      <span class="brand-mark"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 14h3a2 2 0 0 1 2 2v3a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-7a9 9 0 0 1 18 0v7a2 2 0 0 1-2 2h-1a2 2 0 0 1-2-2v-3a2 2 0 0 1 2-2h3"/></svg></span>
      <h1>DJ HQ</h1>
    </div>

    <div class="lib-card">
      <div class="lib-top">
        <div class="mosaic" id="mosaic"></div>
        <div class="lib-name" id="lib-name">
          <select id="lib" aria-label="Library"></select>
          <div class="sub" id="lib-sub"></div>
        </div>
      </div>
      <div class="lib-progress"><div class="bar"><i id="lib-bar" style="width:0%"></i></div><b id="lib-pct"></b></div>
      <div class="lib-foot"><span class="trunc" id="lib-dir"></span></div>
    </div>

    <nav class="nav" id="nav"></nav>

    <div class="sb-foot">
      <div class="sb-update" id="sb-update" hidden></div>
      <div class="sb-status" id="sb-status"><span class="dot"></span><span class="trunc">Checking the playlist…</span></div>
      <div class="sb-row">
        <button class="btn btn-ghost btn-sm" id="btn-addlib" title="Add a music folder + playlist"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/><path d="M12 5v14"/></svg><span class="lbl">Add library</span></button>
        <button class="btn btn-ghost btn-sm btn-icon" id="btn-libmenu" title="Library options"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/><circle cx="5" cy="12" r="1"/></svg></button>
        <span class="spacer"></span>
        <button class="btn btn-ghost btn-sm btn-icon" id="btn-settings" title="Settings"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/></svg></button>
        <button class="btn btn-ghost btn-sm btn-icon" id="btn-theme" title="Appearance"></button>
      </div>
    </div>
  </aside>

  <main class="main">
    <div class="page-head">
      <div class="ph-row">
        <div class="ph-title" id="ph-title"></div>
        <div class="ph-actions">
          <span id="ph-actions" style="display:contents"></span>
          <div class="search"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg><input type="search" id="q" placeholder="Search artist or title…" spellcheck="false" autocomplete="off"><kbd>/</kbd></div>
          <button class="btn btn-primary" id="btn-refresh" title="Fetch the playlist from SoundCloud again and rescan the music folder (also happens automatically every 15 minutes)"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"/><path d="M8 16H3v5"/></svg>Refresh</button>
          <button class="btn btn-ghost btn-icon" id="btn-guide" title="Guide to this page (?)" aria-label="Guide to this page" hidden><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"/><path d="M12 17h.01"/></svg></button>
        </div>
      </div>
      <div class="ph-tools" id="ph-tools" hidden></div>
    </div>
    <div class="page-body" id="page-body"><div class="empty"><span class="spin"></span></div></div>
  </main>
</div>

<div class="player" id="player" hidden></div>
<div class="toast" id="toast"></div>

<script src="app.js"></script>
<script src="pages/playlist.js"></script>
<script src="pages/extras.js"></script>
<script src="pages/inbox.js"></script>
<script src="pages/prepare.js"></script>
<script src="pages/welcome.js"></script>
<script src="pages/setup.js"></script>
<script src="guide.js"></script>
<script src="demo.js"></script>
<script src="tour.js"></script>
<script src="pages/settings.js"></script>
<script src="pages/workthrough.js"></script>
<script src="pages/discover.js"></script>
<script src="pages/likes.js"></script>
<script src="player.js"></script>
<script>boot();</script>
</body>
</html>
