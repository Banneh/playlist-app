<body>

<!-- first run: no library yet (filled by pages/welcome.js) -->
<div id="welcome" class="welcome" hidden></div>

<div id="app" class="app" hidden>
  <!-- macOS: the strip under the hidden title bar that moves the window -->
  <div class="mac-drag" aria-hidden="true"></div>
  <aside class="sidebar">
    <div class="sb-brand">
      <span class="brand-mark"><svg class="logo" viewBox="0 0 64 64" role="img" aria-label="DJ HQ"><rect class="logo-pad" width="64" height="64" rx="14"/><g class="logo-ink"><rect x="9.75" y="26" width="4.5" height="12" rx="2.25"/><rect x="17.75" y="20" width="4.5" height="24" rx="2.25"/><rect x="25.75" y="14" width="4.5" height="36" rx="2.25"/><rect x="35.25" y="18" width="4.5" height="28" rx="2.25" fill-opacity=".38"/><rect x="42.75" y="23" width="4.5" height="18" rx="2.25" fill-opacity=".38"/><rect x="50.25" y="27" width="4.5" height="10" rx="2.25" fill-opacity=".38"/><rect x="31.6" y="12" width="2.4" height="43" rx="1.2"/><path d="M27 8.5 H38.6 L32.8 15 Z"/></g></svg></span>
      <h1>DJ HQ</h1>
    </div>

    <div class="lib-card">
      <div class="lib-top">
        <div class="mosaic" id="mosaic"></div>
        <div class="lib-name" id="lib-name">
          <div class="lib-row"><select id="lib" aria-label="Playlist" data-i18n-aria-label="app.lib.select"></select><button class="btn btn-ghost btn-sm btn-icon" id="btn-plsettings" title="Playlist settings" data-i18n-title="app.lib.plSettings" hidden><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/></svg></button></div>
          <div class="sub" id="lib-sub"></div>
        </div>
      </div>
      <div class="lib-progress"><div class="bar"><i id="lib-bar" style="width:0%"></i></div><b id="lib-pct"></b></div>
      <div class="lib-foot"><span class="trunc" id="lib-dir"></span></div>
    </div>

    <nav class="nav" id="nav"></nav>

    <div class="sb-foot">
      <div class="sb-update" id="sb-update" hidden></div>
      <div class="sb-status" id="sb-status"><span class="dot"></span><span class="trunc" data-i18n="app.status.checking">Checking the playlist…</span></div>
      <div class="sb-row">
        <button class="btn btn-ghost btn-sm" id="btn-addlib" title="Add a music folder + playlist" data-i18n-title="app.lib.addHint"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/><path d="M12 5v14"/></svg><span class="lbl" data-i18n="app.lib.add">Add library</span></button>
        <button class="btn btn-ghost btn-sm btn-icon" id="btn-libmenu" title="Library options" data-i18n-title="app.lib.options"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/><circle cx="5" cy="12" r="1"/></svg></button>
        <span class="spacer"></span>
        <button class="btn btn-ghost btn-sm btn-icon" id="btn-settings" title="Settings" data-i18n-title="app.head.settings"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/></svg></button>
        <button class="btn btn-ghost btn-sm btn-icon" id="btn-theme" title="Appearance" data-i18n-title="common.theme.title"></button>
      </div>
    </div>
  </aside>

  <main class="main">
    <div class="page-head">
      <div class="ph-row">
        <div class="ph-title" id="ph-title"></div>
        <div class="ph-actions">
          <span id="ph-actions" style="display:contents"></span>
          <div class="search"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg><input type="search" id="q" placeholder="Search artist or title…" spellcheck="false" autocomplete="off"><kbd>/</kbd></div>
          <button class="btn btn-icon" id="btn-refresh" title="Fetch the playlist from SoundCloud again and rescan the music folder (also happens automatically every 15 minutes)" aria-label="Refresh" data-i18n-title="app.head.refreshHint" data-i18n-aria-label="common.refresh"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"/><path d="M8 16H3v5"/></svg></button>
          <button class="btn btn-ghost btn-icon q-btn" id="btn-queue" title="Tasks" aria-label="Tasks" data-i18n-title="app.queue.title" data-i18n-aria-label="app.queue.title"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m3 17 2 2 4-4"/><path d="m3 7 2 2 4-4"/><path d="M13 6h8"/><path d="M13 12h8"/><path d="M13 18h8"/></svg><span class="q-badge"></span></button>
          <button class="btn btn-ghost btn-icon" id="btn-guide" title="Guide to this page (?)" aria-label="Guide to this page" data-i18n-title="app.head.guideHint" data-i18n-aria-label="app.head.guide" hidden><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"/><path d="M12 17h.01"/></svg></button>
        </div>
      </div>
      <div class="ph-tools" id="ph-tools" hidden></div>
    </div>
    <div class="page-body" id="page-body"><div class="empty"><span class="spin"></span></div></div>
  </main>
</div>

<div class="player" id="player" hidden></div>
<div class="toast" id="toast"></div>
