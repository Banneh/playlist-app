<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DJ HQ</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎧</text></svg>">
<style>
  :root {
    --bg: #0d0f14; --panel: #151821; --panel2: #1b1f2b; --line: #262b3a;
    --text: #e8eaf0; --dim: #8b91a5; --accent: #7c5cff; --accent2: #ff5c8a;
    --green: #34d399; --amber: #fbbf24;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: radial-gradient(1200px 600px at 80% -10%, #1e1440 0%, var(--bg) 55%);
    color: var(--text); font: 15px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    min-height: 100vh;
  }
  .wrap { max-width: 1050px; margin: 0 auto; padding: 28px 20px 80px; }

  header { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; margin-bottom: 22px; }
  h1 { font-size: 26px; font-weight: 700; letter-spacing: -.02em; }
  h1 a { color: inherit; text-decoration: none; }
  h1 a:hover { color: var(--accent); }
  .stats { display: flex; gap: 10px; margin-left: auto; }
  .stat { background: var(--panel); border: 1px solid var(--line); border-radius: 12px;
          padding: 8px 14px; text-align: center; min-width: 84px; }
  .stat b { display: block; font-size: 20px; }
  .stat span { font-size: 11px; color: var(--dim); text-transform: uppercase; letter-spacing: .08em; }
  .stat.have b { color: var(--green); } .stat.miss b { color: var(--accent2); }

  .bar { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin-bottom: 16px; }
  button {
    background: var(--panel2); color: var(--text); border: 1px solid var(--line);
    border-radius: 10px; padding: 9px 16px; font: inherit; cursor: pointer; transition: .15s;
  }
  button:hover { border-color: var(--accent); }
  button.primary { background: var(--accent); border-color: var(--accent); font-weight: 600; }
  button.primary:hover { filter: brightness(1.12); }
  button:disabled { opacity: .5; cursor: wait; }
  input[type=search] {
    flex: 1; min-width: 200px; background: var(--panel); border: 1px solid var(--line);
    border-radius: 10px; padding: 9px 14px; color: var(--text); font: inherit; outline: none;
  }
  input[type=search]:focus { border-color: var(--accent); }
  select {
    background: var(--panel); color: var(--text); border: 1px solid var(--line);
    border-radius: 10px; padding: 9px 10px; font: inherit; outline: none; cursor: pointer;
  }
  select:focus { border-color: var(--accent); }
  .tabs { display: flex; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
  .tabs button { border: 0; border-radius: 0; background: transparent; padding: 9px 16px; color: var(--dim); }
  .tabs button.on { background: var(--panel2); color: var(--text); font-weight: 600; }

  .progress { height: 6px; background: var(--panel2); border-radius: 3px; overflow: hidden; margin-bottom: 18px; }
  .progress i { display: block; height: 100%; background: linear-gradient(90deg, var(--accent), var(--green)); transition: width .5s; }

  .list { display: flex; flex-direction: column; gap: 6px; }
  .row {
    display: flex; align-items: center; gap: 14px; background: var(--panel);
    border: 1px solid var(--line); border-radius: 12px; padding: 10px 14px; transition: .15s;
  }
  .row:hover { border-color: #3a4158; transform: translateX(2px); }
  .row.have { opacity: .75; }
  .row img { width: 44px; height: 44px; border-radius: 8px; object-fit: cover; background: var(--panel2); }
  .num { color: var(--dim); font-size: 12px; width: 28px; text-align: right; flex-shrink: 0; }
  .meta { flex: 1; min-width: 0; }
  .meta .t { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .meta .a { color: var(--dim); font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .meta .f { color: var(--green); font-size: 11.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; opacity: .8; }
  .meta .f.warn { color: var(--amber); }
  .meta .ed { color: var(--amber); font-size: 11px; margin-left: 6px; }
  .editform { display: flex; flex-direction: column; gap: 6px; flex: 1; min-width: 0; }
  .editform input {
    background: var(--bg); border: 1px solid var(--line); border-radius: 8px;
    padding: 7px 10px; color: var(--text); font: inherit; font-size: 13.5px; outline: none; width: 100%;
  }
  .editform input:focus { border-color: var(--accent); }
  .iconbtn {
    background: transparent; border: 1px solid var(--line); border-radius: 9px;
    color: var(--dim); padding: 7px 10px; font-size: 13px; flex-shrink: 0;
  }
  .iconbtn:hover { color: var(--text); border-color: var(--accent); }
  .iconbtn.save { color: var(--green); }
  .iconbtn.danger:hover { border-color: var(--accent2); color: var(--accent2); }
  .dur { color: var(--dim); font-size: 13px; font-variant-numeric: tabular-nums; }
  .pill {
    font-size: 11px; font-weight: 700; letter-spacing: .06em; padding: 4px 10px;
    border-radius: 999px; flex-shrink: 0; cursor: pointer; user-select: none; border: 1px solid transparent;
  }
  .pill.have { background: rgba(52,211,153,.13); color: var(--green); }
  .pill.miss { background: rgba(255,92,138,.13); color: var(--accent2); }
  .pill.manual { border-color: var(--amber); }
  .pill:hover { filter: brightness(1.25); }
  a.open {
    color: var(--accent); text-decoration: none; font-weight: 600; font-size: 13px;
    padding: 7px 12px; border: 1px solid var(--line); border-radius: 9px; flex-shrink: 0; transition: .15s;
  }
  a.open:hover { border-color: var(--accent); background: rgba(124,92,255,.1); }

  .section { margin: 26px 0 10px; color: var(--dim); font-size: 12px; text-transform: uppercase; letter-spacing: .1em; }
  .extra { color: var(--dim); font-size: 13px; padding: 4px 14px; }
  .empty { text-align: center; color: var(--dim); padding: 60px 0; }
  .toast {
    position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
    background: var(--panel2); border: 1px solid var(--line); border-radius: 10px;
    padding: 10px 18px; opacity: 0; transition: .3s; pointer-events: none;
  }
  .toast.show { opacity: 1; }
  .spin { display: inline-block; animation: sp 1s linear infinite; }
  @keyframes sp { to { transform: rotate(360deg); } }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>🎧 DJ HQ</h1>
    <select id="lib" title="Library"></select>
    <a id="pllink" class="open" href="#" target="_blank" rel="noopener" title="Open playlist on SoundCloud">↗</a>
    <button class="iconbtn" id="btn-addlib" title="Add a music folder + playlist">＋</button>
    <button class="iconbtn danger" id="btn-dellib" title="Remove this library from the app (files stay on disk)">✕</button>
    <div class="stats">
      <div class="stat have"><b id="s-have">–</b><span>have</span></div>
      <div class="stat miss"><b id="s-miss">–</b><span>missing</span></div>
      <div class="stat"><b id="s-local">–</b><span>local files</span></div>
    </div>
  </header>

  <div class="bar">
    <button class="primary" id="btn-refresh">⟳ Fetch playlist</button>
    <button id="btn-rescan">📁 Rescan folder</button>
    <button id="btn-tag" style="display:none">🏷 Write tags</button>
    <select id="device" title="Target player"></select>
    <button id="btn-convert">🎛 Convert</button>
    <input type="search" id="q" placeholder="Search artist or title…">
    <div class="tabs">
      <button data-tab="missing" class="on">Missing</button>
      <button data-tab="have">Have</button>
      <button data-tab="all">All</button>
    </div>
  </div>

  <div class="progress"><i id="pbar" style="width:0%"></i></div>
  <div class="list" id="list"><div class="empty">Loading…</div></div>
  <div id="extras"></div>
</div>
<div class="toast" id="toast"></div>

<script>
let DATA = null, TAB = 'missing', Q = '', EDIT_ID = null;

async function saveEdit(id) {
  const artist = $('#e-artist').value.trim(), title = $('#e-title').value.trim();
  EDIT_ID = null;
  DATA = await api('/api/edit', { id, artist, title });
  render(); toast('Saved — tags will use your values');
}
async function resetEdit(id) {
  EDIT_ID = null;
  DATA = await api('/api/edit', { id, artist: '', title: '' });
  render(); toast('Reverted to SoundCloud values');
}
async function saveExtra(i) {
  const file = DATA.extras[i].name;
  const artist = $('#e-artist').value.trim(), title = $('#e-title').value.trim();
  EDIT_ID = null;
  DATA = await api('/api/edit', { file, artist, title });
  render(); toast('Saved — tags will use your values');
}
async function resetExtra(i) {
  const file = DATA.extras[i].name;
  EDIT_ID = null;
  DATA = await api('/api/edit', { file, artist: '', title: '' });
  render(); toast('Reverted to filename values');
}

const $ = s => document.querySelector(s);
const esc = s => (s || '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const scSearch = q => 'https://soundcloud.com/search?q=' + encodeURIComponent(q.trim());

function toast(msg) {
  const t = $('#toast'); t.textContent = msg; t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2200);
}

async function api(path, body) {
  const r = await fetch(path, body !== undefined
    ? { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(body) }
    : {});
  const j = await r.json();
  if (j.error) throw new Error(j.error);
  return j;
}

function render() {
  if (!DATA) {
    $('#list').innerHTML = '<div class="empty">Loading…</div>';
    return;
  }
  $('#lib').innerHTML = (DATA.libraries || []).map(l =>
    `<option value="${l.id}" ${l.id === DATA.active ? 'selected' : ''}>${esc(l.name)}</option>`).join('');
  const sel = $('#device');
  sel.innerHTML = (DATA.devices || []).map(d =>
    `<option value="${d.id}" ${d.id === DATA.device ? 'selected' : ''}>${esc(d.label)}</option>`).join('');
  $('#pllink').style.visibility = DATA.playlist_url ? 'visible' : 'hidden';
  $('#pllink').href = DATA.playlist_url || '#';
  if (!DATA.ready) {
    ['#s-have', '#s-miss', '#s-local'].forEach(s => $(s).textContent = '–');
    $('#pbar').style.width = '0%';
    $('#btn-tag').style.display = 'none';
    const cb0 = $('#btn-convert');
    cb0.disabled = true; cb0.textContent = '🎛 Convert (0)';
    $('#list').innerHTML = '<div class="empty">No playlist data yet — hit <b>⟳ Fetch playlist</b>.</div>';
    $('#extras').innerHTML = '';
    return;
  }
  $('#s-have').textContent = DATA.have;
  $('#s-miss').textContent = DATA.missing;
  $('#s-local').textContent = DATA.local_count;
  const tb = $('#btn-tag');
  tb.style.display = DATA.untagged > 0 ? '' : 'none';
  tb.textContent = `🏷 Write tags (${DATA.untagged})`;
  $('#pbar').style.width = (100 * DATA.have / (DATA.have + DATA.missing || 1)) + '%';

  const q = Q.toLowerCase();
  const rows = DATA.tracks.filter(t =>
    (TAB === 'all' || (TAB === 'have') === t.have) &&
    (!q || (t.artist + ' ' + t.title + ' ' + t.user).toLowerCase().includes(q)));

  $('#list').innerHTML = rows.length ? rows.map(t => t.id === EDIT_ID ? `
    <div class="row">
      <span class="num">${t.n}</span>
      <img src="${esc(t.art)}" loading="lazy" onerror="this.style.visibility='hidden'">
      <div class="editform">
        <input id="e-artist" value="${esc(t.artist)}" placeholder="Artist">
        <input id="e-title" value="${esc(t.title)}" placeholder="Title"
               onkeydown="if(event.key==='Enter')saveEdit(${t.id})">
      </div>
      <button class="iconbtn save" onclick="saveEdit(${t.id})" title="Save">✓ Save</button>
      ${t.edited ? `<button class="iconbtn danger" onclick="resetEdit(${t.id})" title="Back to SoundCloud values">↺</button>` : ''}
      <button class="iconbtn" onclick="EDIT_ID=null;render()" title="Cancel">✕</button>
    </div>` : `
    <div class="row ${t.have ? 'have' : ''}">
      <span class="num">${t.n}</span>
      <img src="${esc(t.art)}" loading="lazy" onerror="this.style.visibility='hidden'">
      <div class="meta">
        <div class="t">${esc(t.title)}${t.edited ? '<span class="ed" title="Edited manually">✎ edited</span>' : ''}</div>
        <div class="a">${esc(t.artist)}${t.user && t.user !== t.artist ? ' · via ' + esc(t.user) : ''}</div>
        ${t.file ? `<div class="f${t.tagged === false || t.incompat ? ' warn' : ''}">📄 ${esc(t.file)}${
          t.tagged === true ? ' · ✓ tagged' : t.tagged === false ? ' · ⚠ needs tags' : ''}${
          t.incompat ? ' · 🎛 ' + esc(t.incompat) : ''}</div>` : ''}
      </div>
      <span class="dur">${t.dur}</span>
      <button class="iconbtn" onclick="EDIT_ID=${t.id};render();$('#e-artist').focus()" title="Edit artist / title">✎</button>
      <span class="pill ${t.have ? 'have' : 'miss'} ${t.override ? 'manual' : ''}"
            title="Click to toggle manually" onclick="toggle(${t.id}, ${t.have}, ${t.auto})">
        ${t.have ? 'HAVE' : 'MISSING'}</span>
      ${!t.have ? `<a class="open" href="${scSearch(t.artist + ' ' + t.title)}" target="_blank"
        rel="noopener" title="Search SoundCloud for this track">🔍</a>` : ''}
      <a class="open" href="${esc(t.url)}" target="_blank" rel="noopener">Open ↗</a>
    </div>`).join('')
    : '<div class="empty">Nothing here 🎉</div>';

  $('#extras').innerHTML = DATA.extras.length
    ? '<div class="section">Local files not in playlist (' + DATA.extras.length + ')</div><div class="list">'
      + DATA.extras.map((f, i) => 'x' + i === EDIT_ID ? `
        <div class="row">
          <span class="num">·</span>
          <div class="editform">
            <input id="e-artist" value="${esc(f.artist)}" placeholder="Artist">
            <input id="e-title" value="${esc(f.title)}" placeholder="Title"
                   onkeydown="if(event.key==='Enter')saveExtra(${i})">
          </div>
          <button class="iconbtn save" onclick="saveExtra(${i})">✓ Save</button>
          ${f.edited ? `<button class="iconbtn danger" onclick="resetExtra(${i})" title="Back to filename values">↺</button>` : ''}
          <button class="iconbtn" onclick="EDIT_ID=null;render()">✕</button>
        </div>` : `
        <div class="row">
          <span class="num">·</span>
          <div class="meta">
            <div class="t">${esc(f.title)}${f.edited ? '<span class="ed">✎ edited</span>' : ''}</div>
            <div class="a">${esc(f.artist) || '<i>no artist — click ✎</i>'}</div>
            <div class="f${f.tagged === false || f.incompat ? ' warn' : ''}">📄 ${esc(f.name)}${
              f.tagged ? ' · ✓ tagged' : ' · ⚠ needs tags'}${
              f.incompat ? ' · 🎛 ' + esc(f.incompat) : ''}</div>
          </div>
          <button class="iconbtn" onclick="EDIT_ID='x${i}';render();$('#e-artist').focus()" title="Edit artist / title">✎</button>
          <a class="open" href="${scSearch(f.artist + ' ' + f.title)}" target="_blank"
             rel="noopener" title="Search SoundCloud">🔍</a>
        </div>`).join('') + '</div>'
    : '';

  const cb = $('#btn-convert');
  cb.disabled = !DATA.incompatible;
  cb.textContent = `🎛 Convert (${DATA.incompatible})`;
  cb.title = DATA.incompatible ? '' : 'All local files are compatible with the selected player';
}

async function toggle(id, have, auto) {
  // cycle: auto -> forced opposite -> back to auto
  const t = DATA.tracks.find(x => x.id === id);
  let status = null;
  if (!t.override) status = have ? 'missing' : 'have';
  DATA = await api('/api/override', { id, status });
  render();
}

async function run(btn, path, msg) {
  const b = $(btn), old = b.innerHTML;
  b.disabled = true; b.innerHTML = '<span class="spin">⟳</span> Working…';
  try { DATA = await api(path, {}); toast(msg); }
  catch (e) { toast('Error: ' + e.message); }
  b.disabled = false; b.innerHTML = old;
  render();  // after restoring the label, so render's fresh counts win
}

$('#btn-refresh').onclick = () => run('#btn-refresh', '/api/refresh', 'Playlist fetched from SoundCloud');
$('#btn-rescan').onclick = () => run('#btn-rescan', '/api/rescan', 'Folder rescanned');
$('#btn-tag').onclick = async () => {
  const b = $('#btn-tag');
  b.disabled = true; b.innerHTML = '<span class="spin">⟳</span> Tagging…';
  try {
    DATA = await api('/api/tag', {});
    const r = DATA.tag_report || {};
    toast(r.errors && r.errors.length
      ? `Tagged ${r.done}, ${r.errors.length} failed: ${r.errors[0]}`
      : `Tagged ${r.done} file(s) for rekordbox`);
  } catch (e) { toast('Error: ' + e.message); }
  b.disabled = false;
  render();
};
$('#q').oninput = e => { Q = e.target.value; render(); };
$('#device').onchange = async e => {
  DATA = await api('/api/device', { device: e.target.value });
  render(); toast('Checking against ' + e.target.selectedOptions[0].text);
};
$('#btn-convert').onclick = async () => {
  if (!confirm(`Convert ${DATA.incompatible} file(s) in place for your player?\n` +
               `Originals are backed up to playlist-app/originals.\n` +
               `Same filename & duration — rekordbox keeps hot cues and grids.`)) return;
  const b = $('#btn-convert');
  b.disabled = true; b.innerHTML = '<span class="spin">⟳</span> Converting…';
  try {
    DATA = await api('/api/convert', {});
    const r = DATA.convert_report || {};
    toast(r.errors && r.errors.length
      ? `Converted ${r.done}, ${r.errors.length} failed: ${r.errors[0]}`
      : `Converted ${r.done} file(s) — originals in playlist-app/originals`);
  } catch (e) { toast('Error: ' + e.message); }
  render();  // repaints the button with the fresh count
};
$('#lib').onchange = async e => {
  DATA = await api('/api/library', { op: 'select', id: e.target.value });
  EDIT_ID = null; render();
};
$('#btn-addlib').onclick = async () => {
  const dir = prompt('Full path to the music folder:\n(e.g. /Users/janbany/Desktop/Techno)');
  if (!dir) return;
  const url = prompt('SoundCloud playlist URL for this folder:');
  if (!url) return;
  toast('Adding library — fetching playlist…');
  try { DATA = await api('/api/library', { op: 'add', dir, url }); render(); toast('Library added'); }
  catch (e) { toast('Error: ' + e.message); DATA = await api('/api/state'); render(); }
};
$('#btn-dellib').onclick = async () => {
  const name = $('#lib').selectedOptions[0] ? $('#lib').selectedOptions[0].text : 'this library';
  if (!confirm(`Remove "${name}" from DJ HQ? Your music files stay on disk.`)) return;
  try { DATA = await api('/api/library', { op: 'remove', id: DATA.active }); render(); }
  catch (e) { toast('Error: ' + e.message); }
};
document.querySelectorAll('.tabs button').forEach(b => b.onclick = () => {
  document.querySelectorAll('.tabs button').forEach(x => x.classList.remove('on'));
  b.classList.add('on'); TAB = b.dataset.tab; render();
});

(async () => {
  try {
    DATA = await api('/api/state');
    render();
    if (!DATA.ready) { DATA = await api('/api/refresh', {}); render(); }
  } catch (e) { toast('Error: ' + e.message); }
})();
</script>
</body>
</html>
